<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Level Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pusab', Arial, sans-serif;
            background: linear-gradient(180deg, #00a8ff 0%, #0077cc 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 3em;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0px #0077cc, 5px 5px 10px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .tabs-container {
            background: linear-gradient(180deg, #964b00 0%, #6b3410 100%);
            border: 4px solid #4a2908;
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            background: linear-gradient(180deg, #ffaa00 0%, #ff8800 100%);
            border: 3px solid #995500;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #995500;
        }
        
        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #995500;
        }
        
        .tab:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #995500;
        }
        
        .tab.active {
            background: linear-gradient(180deg, #00ff00 0%, #00cc00 100%);
            border-color: #008800;
            box-shadow: 0 4px 0 #008800;
        }
        
        .tab.active:hover {
            box-shadow: 0 6px 0 #008800;
        }
        
        .tab.active:active {
            box-shadow: 0 2px 0 #008800;
        }
        
        .filters-section {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 3px solid #995500;
            border-radius: 10px;
            background: white;
            font-weight: bold;
            outline: none;
            margin-bottom: 10px;
        }
        
        .difficulty-filter {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 3px solid #995500;
            border-radius: 10px;
            background: white;
            font-weight: bold;
            outline: none;
            margin-bottom: 10px;
        }
        
        .search-btn {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            font-size: 1.2em;
            background: linear-gradient(180deg, #ffaa00 0%, #ff8800 100%);
            border: 3px solid #995500;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            cursor: pointer;
            box-shadow: 0 4px 0 #995500;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #995500;
        }
        
        .search-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #995500;
        }
        
        .loading {
            text-align: center;
            font-size: 1.5em;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .level-card {
            background: linear-gradient(180deg, #964b00 0%, #6b3410 100%);
            border: 4px solid #4a2908;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        
        .level-card:hover {
            transform: translateY(-3px);
        }
        
        .level-header {
            background: linear-gradient(180deg, #333 0%, #111 100%);
            border: 2px solid #000;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .level-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            word-break: break-word;
        }
        
        .level-author {
            color: #00ffff;
            font-size: 1.1em;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }
        
        .level-stats {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .difficulty-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            background: linear-gradient(180deg, #ff00ff 0%, #cc00cc 100%);
            border: 2px solid #880088;
            margin: 5px 0;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }
        
        .level-id-box {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ffaa00;
            margin: 10px 0;
            font-family: monospace;
            font-size: 1.2em;
            text-align: center;
            font-weight: bold;
        }
        
        .copy-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, #00ff00 0%, #00cc00 100%);
            border: 3px solid #008800;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            cursor: pointer;
            box-shadow: 0 4px 0 #008800;
        }
        
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #008800;
        }
        
        .copy-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #008800;
        }
        
        .copy-btn.copied {
            background: linear-gradient(180deg, #ffff00 0%, #ffcc00 100%);
            border-color: #cc9900;
            box-shadow: 0 4px 0 #cc9900;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .page-btn {
            padding: 15px 25px;
            background: linear-gradient(180deg, #ffaa00 0%, #ff8800 100%);
            border: 3px solid #995500;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            cursor: pointer;
            box-shadow: 0 4px 0 #995500;
        }
        
        .page-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #995500;
        }
        
        .page-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #995500;
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .page-btn.active {
            background: linear-gradient(180deg, #00ff00 0%, #00cc00 100%);
            border-color: #008800;
            box-shadow: 0 4px 0 #008800;
        }
        
        .page-info {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        
        .error {
            background: linear-gradient(180deg, #ff0000 0%, #cc0000 100%);
            border: 3px solid #880000;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">⚡ LEVEL BROWSER ⚡</div>
        </div>
        
        <div class="tabs-container">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('search')">🔍 SEARCH</div>
                <div class="tab" onclick="switchTab('recent')">🕒 RECENT</div>
                <div class="tab" onclick="switchTab('liked')">❤️ LIKED</div>
                <div class="tab" onclick="switchTab('downloaded')">📥 DOWNLOADS</div>
            </div>
            
            <div id="filtersSection" class="filters-section">
                <input type="text" class="search-input" id="searchInput" placeholder="Search levels..." style="display: none;" />
                <select class="difficulty-filter" id="difficultyFilter">
                    <option value="">All Difficulties</option>
                    <option value="0">Unrated</option>
                    <option value="1">Auto</option>
                    <option value="2">Easy</option>
                    <option value="3">Normal</option>
                    <option value="4">Hard</option>
                    <option value="5">Harder</option>
                    <option value="6">Insane</option>
                    <option value="7">Easy Demon</option>
                    <option value="8">Medium Demon</option>
                    <option value="9">Hard Demon</option>
                    <option value="10">Insane Demon</option>
                    <option value="11">Extreme Demon</option>
                </select>
                <button class="search-btn" id="actionBtn" onclick="searchLevels()">SEARCH</button>
            </div>
        </div>
        
        <div id="loading" class="loading" style="display: none;">LOADING...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="results" class="levels-grid"></div>
        
        <div id="pagination" class="pagination" style="display: none;">
            <button class="page-btn" onclick="changePage(-1)">◄ PREV</button>
            <div class="page-info" id="pageInfo">Page 1 of 501</div>
            <button class="page-btn" onclick="changePage(1)">NEXT ►</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://gdbrowser.com/api/';
        let currentTab = 'search';
        let currentPage = 1;
        let totalPages = 501;
        let currentQuery = '';
        let currentDifficulty = '';
        
        // Update URL parameters
        function updateURL() {
            const params = new URLSearchParams();
            params.set('tab', currentTab);
            if (currentPage > 1) {
                params.set('page', currentPage);
            }
            if (currentDifficulty) {
                params.set('diff', currentDifficulty);
            }
            const newURL = window.location.pathname + '?' + params.toString();
            window.history.pushState({}, '', newURL);
        }
        
        // Parse URL parameters on load
        function parseURL() {
            const params = new URLSearchParams(window.location.search);
            
            // Check for tab
            if (params.has('tab')) {
                currentTab = params.get('tab');
            }
            
            // Check for page
            if (params.has('page')) {
                currentPage = parseInt(params.get('page')) || 1;
            }
            
            // Check for difficulty
            if (params.has('diff')) {
                currentDifficulty = params.get('diff');
                document.getElementById('difficultyFilter').value = currentDifficulty;
            }
        }
        
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchLevels();
            }
        });
        
        document.getElementById('difficultyFilter').addEventListener('change', function() {
            currentDifficulty = this.value;
            if (currentTab !== 'search') {
                currentPage = 1;
                updateURL();
                reloadCurrentTab();
            }
        });
        
        function reloadCurrentTab() {
            if (currentTab === 'recent') {
                loadLevels('search/*?type=recent');
            } else if (currentTab === 'liked') {
                loadLevels('search/*?type=mostliked');
            } else if (currentTab === 'downloaded') {
                loadLevels('search/*?type=mostdownloaded');
            }
        }
        
        function switchTab(tab) {
            currentTab = tab;
            currentPage = 1;
            
            // Update tab styles
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Show/hide search input and update button
            const searchInput = document.getElementById('searchInput');
            const actionBtn = document.getElementById('actionBtn');
            if (tab === 'search') {
                searchInput.style.display = 'block';
                actionBtn.textContent = 'SEARCH';
                actionBtn.onclick = searchLevels;
            } else {
                searchInput.style.display = 'none';
                actionBtn.textContent = 'APPLY FILTER';
                actionBtn.onclick = reloadCurrentTab;
            }
            
            // Clear previous results
            document.getElementById('results').innerHTML = '';
            document.getElementById('error').style.display = 'none';
            
            updateURL();
            
            // Load content based on tab
            if (tab === 'recent') {
                loadLevels('search/*?type=recent');
            } else if (tab === 'liked') {
                loadLevels('search/*?type=mostliked');
            } else if (tab === 'downloaded') {
                loadLevels('search/*?type=mostdownloaded');
            }
        }
        
        function searchLevels() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showError('Please enter a search term!');
                return;
            }
            
            currentQuery = query;
            currentPage = 1;
            currentDifficulty = document.getElementById('difficultyFilter').value;
            
            updateURL();
            loadLevels('search/' + encodeURIComponent(query));
        }
        
        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            
            currentPage = newPage;
            updateURL();
            
            // Reload based on current tab
            if (currentTab === 'search' && currentQuery) {
                loadLevels('search/' + encodeURIComponent(currentQuery));
            } else if (currentTab === 'recent') {
                loadLevels('search/*?type=recent');
            } else if (currentTab === 'liked') {
                loadLevels('search/*?type=mostliked');
            } else if (currentTab === 'downloaded') {
                loadLevels('search/*?type=mostdownloaded');
            }
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        async function loadLevels(endpoint) {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            const pagination = document.getElementById('pagination');
            
            loading.style.display = 'block';
            results.innerHTML = '';
            error.style.display = 'none';
            pagination.style.display = 'none';
            
            try {
                // Add page parameter
                const separator = endpoint.includes('?') ? '&' : '?';
                let url = API_URL + endpoint + separator + 'page=' + (currentPage - 1);
                
                // Add difficulty filter if selected
                if (currentDifficulty) {
                    url += '&diff=' + currentDifficulty;
                }
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch levels');
                }
                
                const levels = await response.json();
                
                loading.style.display = 'none';
                
                if (!levels || levels.length === 0) {
                    showError('No levels found!');
                    return;
                }
                
                displayLevels(levels);
                
                // Show pagination
                pagination.style.display = 'flex';
                document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
                
            } catch (err) {
                loading.style.display = 'none';
                showError('Error fetching levels: ' + err.message);
            }
        }
        
        function displayLevels(levels) {
            const results = document.getElementById('results');
            
            levels.forEach(level => {
                const card = document.createElement('div');
                card.className = 'level-card';
                
                const difficulty = level.difficulty || 'N/A';
                const stars = level.stars || 0;
                const downloads = level.downloads || 0;
                const likes = level.likes || 0;
                const length = level.length || 'Unknown';
                
                card.innerHTML = `
                    <div class="level-header">
                        <div class="level-name">${level.name || 'Unnamed'}</div>
                        <div class="level-author">by ${level.author || 'Unknown'}</div>
                    </div>
                    
                    <div class="level-stats">
                        <div class="stat-row">
                            <span>⭐ Stars:</span>
                            <span>${stars}</span>
                        </div>
                        <div class="stat-row">
                            <span>📥 Downloads:</span>
                            <span>${downloads.toLocaleString()}</span>
                        </div>
                        <div class="stat-row">
                            <span>❤️ Likes:</span>
                            <span>${likes.toLocaleString()}</span>
                        </div>
                        <div class="stat-row">
                            <span>📏 Length:</span>
                            <span>${length}</span>
                        </div>
                        <div class="stat-row">
                            <span>🎮 Version:</span>
                            <span>${level.gameVersion || 'Unknown'}</span>
                        </div>
                    </div>
                    
                    <div class="difficulty-badge">${difficulty}</div>
                    
                    <div class="level-id-box">ID: ${level.id}</div>
                    
                    <button class="copy-btn" onclick="copyID('${level.id}', this)">COPY ID</button>
                `;
                
                results.appendChild(card);
            });
        }
        
        function copyID(id, button) {
            navigator.clipboard.writeText(id).then(() => {
                const originalText = button.textContent;
                button.textContent = '✓ COPIED!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }
        
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.style.display = 'block';
        }
        
        // Parse URL on page load
        window.addEventListener('load', () => {
            parseURL();
            
            // Update tab UI if needed
            if (currentTab !== 'search') {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                const tabElement = Array.from(document.querySelectorAll('.tab')).find(t => 
                    t.getAttribute('onclick').includes(`'${currentTab}'`)
                );
                if (tabElement) tabElement.classList.add('active');
                
                document.getElementById('searchInput').style.display = 'none';
                document.getElementById('actionBtn').textContent = 'APPLY FILTER';
                document.getElementById('actionBtn').onclick = reloadCurrentTab;
                
                // Load the appropriate content
                if (currentTab === 'recent') {
                    loadLevels('search/*?type=recent');
                } else if (currentTab === 'liked') {
                    loadLevels('search/*?type=mostliked');
                } else if (currentTab === 'downloaded') {
                    loadLevels('search/*?type=mostdownloaded');
                }
            } else {
                document.getElementById('searchInput').style.display = 'block';
                document.getElementById('actionBtn').textContent = 'SEARCH';
                document.getElementById('actionBtn').onclick = searchLevels;
            }
        });
    </script>
</body>
</html>
